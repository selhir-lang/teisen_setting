<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保護されたコンテンツ</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .content {
            margin: 2rem 0;
            text-align: left;
            line-height: 1.6;
            padding: 1.5rem;
            background-color: #f3f4f6;
            border-radius: 0.5rem;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .loading {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
        }

        button {
            padding: 0.625rem 1.25rem;
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--danger-hover);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <h1>機密情報</h1>
        <div id="content" class="content">
            <div class="loading">復号中...</div>
        </div>
        <button id="logoutBtn">ログアウト</button>
    </div>

    <script>
        // 暗号化されたデータ (Base64)
        const ENCRYPTED_DATA_B64 = '+zw2qri6UPi5joCRjZpqkYKeOE924JkWHYGVwiCDnw4wn0+wqwXtwM3cCJje9LW2qo8I4eCrSQ4lhG/K5f2F8GyI8OpO7KZ8CRmAZuU90j1nNqZxAv5DO/e3maYpD1QdjRLmg8kINSBwtvP9uB8UzT2+0fCFU6sduE/KJDxAn7qhm6EzFvxlxwgG34n7fX9Y1nswNzDZAo0wfk3sBS8NifRx2sphs+mVLIJPMuEXvgF1Ub6TQ7aWHfbbtuxK16mw/cshB9nxS6+rCxd8X0XCeq9JwR6PihQsrX9sUgddE2KOxJXUiM/tu6u8AxRn2JXEJt715LS79QzHz1VtwGIwb357DLrOf/v5PYUDjIrxZRxaBrL8N4+0b/238OcPYQEj3LXIvkfrjJy70aW9HlGXQVJ0H9UKkenCl3pKnNLkOuIpm45K0lDptzBzLk73qRn4V85gea5uC9KTPEaXr3o=';

        async function decryptContent() {
            const password = sessionStorage.getItem('key');
            if (!password) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const combined = Uint8Array.from(atob(ENCRYPTED_DATA_B64), c => c.charCodeAt(0));
                const salt = combined.slice(0, 16);
                const iv = combined.slice(16, 28);
                const data = combined.slice(28);

                const encoder = new TextEncoder();
                const passwordKey = await crypto.subtle.importKey(
                    'raw',
                    encoder.encode(password),
                    'PBKDF2',
                    false,
                    ['deriveKey']
                );

                const aesKey = await crypto.subtle.deriveKey(
                    {
                        name: 'PBKDF2',
                        salt: salt,
                        iterations: 100000,
                        hash: 'SHA-256'
                    },
                    passwordKey,
                    { name: 'AES-GCM', length: 256 },
                    false,
                    ['decrypt']
                );

                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv: iv },
                    aesKey,
                    data
                );

                const decoder = new TextDecoder();
                document.getElementById('content').innerHTML = decoder.decode(decryptedBuffer);
            } catch (error) {
                console.error('Decryption failed:', error);
                document.getElementById('content').innerHTML = '<p style="color: red; text-align: center;">復号に失敗しました。セッションが無効です。</p>';
                setTimeout(() => logout(), 2000);
            }
        }

        function logout() {
            sessionStorage.removeItem('key');
            window.location.href = 'index.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);

        // 実行
        decryptContent();
    </script>
</body>
</html>
